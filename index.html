			--field: #1b1a17;
			--w: 1500px;
			color-scheme: dark

		.pole {
			height: 14px;
			background: repeating-linear-gradient(-45deg, var(--gold) 0 14px, #000 14px 28px, var(--ink) 28px 42px, #000 42px 56px)
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: end;
			gap: 16px;
			flex-wrap: wrap;
			max-width: var(--w);
			margin: 0 auto;
			padding: 18px 20px 6px
		}

		h1 {
			font-family: 'Big Shoulders Display', sans-serif;
			font-weight: 900;
			font-size: clamp(2.2rem, 5vw, 3.2rem);
			line-height: .95;
			margin: 0;
			letter-spacing: .01em
		}

		h2 {
			font-family: 'Big Shoulders Display', sans-serif;
			font-size: 1.6rem;
			margin: 0 0 12px;
			color: var(--gold)
		}

		h3 {
			font-family: 'Big Shoulders Display', sans-serif;
			font-size: 1.25rem;
			margin: 18px 0 8px;
			color: var(--gold)
		}

		.colunas {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 20px;
			max-width: var(--w);
			margin: 0 auto;
			padding: 10px 20px 0
		}

		.coluna {
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 20px;
			align-content: start;
			max-height: calc(100vh - 170px);
			min-height: 320px;
			overflow-y: auto;
			padding-right: 8px;
			scrollbar-width: thin;
			scrollbar-color: var(--gold) rgba(255, 255, 255, .08)
		}

		.coluna::-webkit-scrollbar {
			width: 10px
		}

		.coluna::-webkit-scrollbar-track {
			background: rgba(255, 255, 255, .06);
			border-radius: 8px
		}

		.coluna::-webkit-scrollbar-thumb {
			background: var(--gold);
			border-radius: 8px
		}

		.coluna>* {
			min-width: 0
		}

		.coluna:focus-visible {
			outline: 3px solid var(--gold);
			outline-offset: 2px;
			border-radius: 10px
		}

		.rodape {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 20px;
			max-width: var(--w);
			margin: 20px auto 60px;
			padding: 0 20px
		}

		@media(max-width:900px) {

			.colunas,
			.rodape {
				grid-template-columns: minmax(0, 1fr)
			}

			.coluna {

	<script type="text/babel">
		const {useState, useEffect, useCallback} = React;

		const ROTULOS = {

		const FORM0 = {nome: "", descricao: "", valor: "", valorCompra: "", quantidade: "", categoriaId: "", semEstoque: false};

		const carregarCfg = () => {
			try {return {...PADRAO, ...JSON.parse(localStorage.getItem("salaoCfg2") || "{}")};}
			catch {return PADRAO;}
		};

		// o back-end manda data em formato brasileiro "dd/MM/yyyy HH:mm:ss", que o `new Date(string)`
		// nativo não entende de forma confiável (ele espera MM/dd/yyyy ou ISO) — parser manual pra isso
		const parseDataBR = (v) => {
			if (typeof v !== "string") return null;
			const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
			if (!m) return null;
			const [, dd, mm, yyyy, hh, min, ss] = m;
			const d = new Date(Number(yyyy), Number(mm) - 1, Number(dd), Number(hh || 0), Number(min || 0), Number(ss || 0));
			return isNaN(d) ? null : d;
		};
		const hora = (v) => {
			if (!v) return "—";
			if (typeof v === "string" && /^\d{1,2}:\d{2}(:\d{2})?$/.test(v)) return v;
			let d = parseDataBR(v);
			if (!d) {
				if (Array.isArray(v)) d = new Date(v[0], v[1] - 1, v[2], v[3] || 0, v[4] || 0, v[5] || 0);
				else if (typeof v === "number") d = new Date(v < 1e11 ? v * 1000 : v);
				else d = new Date(v);
			}
			return isNaN(d) ? String(v) : d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
		};
		const statusDe = (c) => String(c?.status || c?.statusAtendimento || "").toUpperCase();
		const lista = (d) => (Array.isArray(d) ? d : d?.content || []);
		const valorDe = (p) => p.valorDeVenda ?? p.valor ?? p.preco;
		const valorCompraDe = (p) => p.valorDeCompra ?? p.valorCompra ?? 0;
		const semControle = (p) => p.controlarEstoque === false || p.quantidade == null;
		const reais = (n) => (n != null ? `R$ ${Number(n).toFixed(2)}` : "—");
		const nomeDaResposta = (r) => r?.nome ?? r?.clienteNome ?? r?.cliente?.nome ?? null;
		// o nome da categoria pode vir com outra chave no JSON: tenta as comuns e, por fim, o primeiro texto do objeto
		const nomeCategoria = (c) => c.nome ?? c.name ?? c.descricao ?? c.titulo ?? c.categoria
			?? Object.entries(c).find(([k, v]) => k !== "id" && typeof v === "string" && !/img|url/i.test(k))?.[1] ?? `Categoria ${c.id}`;
		const itensDoAtendimento = (o) => (Array.isArray(o.items) ? o.items.map((i) => ({
			produtoId: i.produto?.id ?? i.id?.produto?.id ?? i.produtoId ?? null,

		})).filter((i) => i.produtoId != null && i.quantidade != null) : []);
		// procura a hora de fim do atendimento em /orders (no atendimento, no pagamento ou no cliente)
		const ehValorData = (x) => typeof x === "string" || typeof x === "number" || Array.isArray(x);
		const fimDe = (o) => {
			for (const f of [o, o.pagamento, o.cliente]) {
				if (!f) continue;

				if (k) return f[k];

				const k = Object.keys(pg).find((k) => /data|momento|instante|hora|pago/i.test(k) && pg[k] != null && ehValorData(pg[k]));

		// datas só com HH:mm:ss não trazem o dia: nesse caso considera que é de hoje
		const ehHoje = (v) => {
			if (!v || (typeof v === "string" && /^\d{1,2}:\d{2}(:\d{2})?$/.test(v))) return true;
			let d = parseDataBR(v);

			return isNaN(d) ? true : d.toDateString() === new Date().toDateString();

		// mesma leitura de data usada acima, mas devolve o objeto Date (ou null se só vier a hora)
		const dataDe = (v) => {
			if (!v || (typeof v === "string" && /^\d{1,2}:\d{2}(:\d{2})?$/.test(v))) return null;

		const noPeriodo = (v, periodo, dataEscolhida) => {

			return d.toDateString() === agora.toDateString();
		};
		const ROTULOS_PERIODO = {dia: "Hoje", semana: "Esta semana", mes: "Este mês"};

		function Relogio() {
			const [d, setD] = useState(new Date());
			useEffect(() => {const t = setInterval(() => setD(new Date()), 1000); return () => clearInterval(t);}, []);
			return <>{d.toLocaleTimeString("pt-BR")}</>;
		}
		function Contador({valor, fmt = (n) => Math.round(n)}) {
			const [v, setV] = useState(0);
			const ant = React.useRef(0);
			useEffect(() => {
				if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {setV(valor); ant.current = valor; return;}
				const de = ant.current, t0 = performance.now();
				let id;
				const passo = (t) => {
					const p = Math.min(1, (t - t0) / 700), x = de + (valor - de) * (1 - Math.pow(1 - p, 3));
					setV(x); ant.current = x;
					if (p < 1) id = requestAnimationFrame(passo);
				};
				id = requestAnimationFrame(passo);
				return () => cancelAnimationFrame(id);
			}, [valor]);
			return <>{fmt(v)}</>;
		}

		function App() {
			const [cfg, setCfg] = useState(carregarCfg);
			const [fila, setFila] = useState([]);
			const [produtos, setProdutos] = useState([]);
			const [nome, setNome] = useState("");
			const [prodId, setProdId] = useState("");
			const [qtd, setQtd] = useState(1);
			const [pagamento, setPagamento] = useState("PIX");
			const [atual, setAtual] = useState(null);
			const [itens, setItens] = useState([]);
			const [form, setForm] = useState(FORM0);
			const [filtro, setFiltro] = useState("");
			const [ajustes, setAjustes] = useState({});
			const [editandoId, setEditandoId] = useState(null);
			const [formEdicao, setFormEdicao] = useState(null);
			const [categorias, setCategorias] = useState([]);
			const [nomeCat, setNomeCat] = useState("");
			const [atendidos, setAtendidos] = useState([]);
			const [periodo, setPeriodo] = useState("dia");
			const [dataEscolhida, setDataEscolhida] = useState(null);
			const [mostrarCalendario, setMostrarCalendario] = useState(false);
			// filtro do faturamento do topo: independente do período do relatório (que só afeta a seção "Relatório de vendas")
			const [periodoTopo, setPeriodoTopo] = useState("dia");
			const [dataEscolhidaTopo, setDataEscolhidaTopo] = useState(null);
			const [mostrarConfigFaturamento, setMostrarConfigFaturamento] = useState(false);
			const [info, setInfo] = useState("");
			const [esq, setEsq] = useState(false);
			const [dir, setDir] = useState(false);
			const [avisoProd, setAvisoProd] = useState("");
			const [avisoCat, setAvisoCat] = useState("");
			const [log, setLog] = useState([]);
			const [erro, setErro] = useState("");

			const salvarCfg = (novo) => {
				setCfg(novo);
				try {localStorage.setItem("salaoCfg2", JSON.stringify(novo));} catch { }
			};

			const api = useCallback(async (chave, {vars = {}, body} = {}) => {
				const [metodo, ...resto] = cfg[chave].trim().split(/\s+/);
				let caminho = resto.join("");
				for (const [k, v] of Object.entries(vars)) caminho = caminho.split(`{${k}}`).join(encodeURIComponent(v));
				const url = cfg.base.replace(/\/$/, "") + caminho;
				const reg = {hora: new Date().toLocaleTimeString("pt-BR"), req: `${metodo.toUpperCase()} ${url}` + (body ? "  " + JSON.stringify(body) : "")};
				try {
					const r = await fetch(url, {
						method: metodo.toUpperCase(),
						headers: body ? {"Content-Type": "application/json"} : {},
						body: body ? JSON.stringify(body) : undefined,
					});
					const txt = await r.text();
					let dados = txt;
					try {dados = txt ? JSON.parse(txt) : null;} catch { }
					setLog((l) => [{...reg, ok: r.ok, res: `${r.status}  ${txt.slice(0, 500)}`}, ...l].slice(0, 30));
					if (!r.ok) throw new Error(`Erro ${r.status}: ${typeof dados === "string" ? dados : dados?.message || dados?.error || "veja o log"}`);
					setErro("");
					return dados;
				} catch (e) {
					if (e instanceof TypeError) {
						const msg = "Não consegui falar com a API. Confira se ela está rodando e se o CORS libera esta origem.";
						setLog((l) => [{...reg, ok: false, res: msg}, ...l].slice(0, 30));
						setErro(msg);
					} else setErro(e.message);
					throw e;
				}
			}, [cfg]);

			const atualizar = useCallback(async () => {
				try {setFila(lista(await api("listar")));} catch { }
			}, [api]);

			const removerDaFila = async (c) => {
				if (!window.confirm(`Remover ${c.nome} da fila? (chegou e foi embora sem ser atendido)`)) return;
				try {
					await api("excluirCliente", {vars: {id: c.id}});
					setFila((l) => l.filter((x) => x.id !== c.id));
				} catch { atualizar(); }
			};

			const carregarProdutos = useCallback(async () => {
				try {
					const l = lista(await api("produtos"));
					setProdutos(l);
					setProdId((p) => (l.some((x) => String(x.id) === String(p)) ? p : (l[0]?.id ?? "")));
				} catch { }
			}, [api]);

			// descobre sozinho quem está em atendimento (e o id do atendimento) a partir de /orders
			const sincronizar = useCallback(async (dica, recente) => {
				try {
					const l = lista(await api("atendimentos"));
					const emAtend = (o) => {const s = statusDe(o.cliente); return s.includes("ATENDIMENTO") && !s.includes("FINAL");};
					const maisNovo = (a) => [...a].sort((x, y) => y.id - x.id)[0];
					const o = recente ? maisNovo(l) : maisNovo(l.filter(emAtend));
					if (o) {
						const cli = o.cliente || {};
						setAtual({clienteId: cli.id ?? o.clienteId ?? null, nome: cli.nome ?? dica ?? "Cliente", atendimentoId: o.id, dataChegada: cli.dataChegada, dataAtendimento: o.inicioAtendimento});
						const its = Array.isArray(o.items) ? o.items.map((i) => ({
							produtoId: i.produto?.id ?? i.id?.produto?.id ?? i.produtoId ?? null,
							nome: i.produto?.nome ?? i.id?.produto?.nome ?? i.nome ?? null,
							quantidade: i.quantidade,
							valor: i.preco ?? i.valor ?? null,
						})).filter((i) => i.produtoId != null && i.quantidade != null) : [];
						if (its.length) setItens(its.map((i) => ({...i, nome: i.nome || `Produto ${i.produtoId}`})));
					} else setAtual(dica ? {clienteId: null, nome: dica, atendimentoId: null} : null);
				} catch { }
			}, [api]);

			const carregarCategorias = useCallback(async () => {
				try {setCategorias(lista(await api("categorias")));} catch { }
			}, [api]);

			const carregarAtendidos = useCallback(async () => {
				try {setAtendidos(lista(await api("atendimentos")));} catch { }
			}, [api]);

			const atualizarTudo = () => {atualizar(); carregarProdutos(); sincronizar(); carregarCategorias(); carregarAtendidos();};
			useEffect(() => {atualizarTudo();}, []);

			const abrir = (lado) => {
				const [set, outro] = lado === "esq" ? [setEsq, setDir] : [setDir, setEsq];
				set((v) => !v);
				if (window.matchMedia("(max-width: 900px)").matches) outro(false);
			};
			useEffect(() => {
				const tecla = (e) => {if (e.key === "Escape") {setEsq(false); setDir(false);} };
				window.addEventListener("keydown", tecla);
				if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return () => window.removeEventListener("keydown", tecla);
				let raf = 0;
				const mover = (e) => {
					cancelAnimationFrame(raf);
					raf = requestAnimationFrame(() => {
						const r = document.documentElement.style;
						r.setProperty("--mx", e.clientX + "px"); r.setProperty("--my", e.clientY + "px");
						r.setProperty("--px", ((e.clientX / innerWidth - 0.5) * -14).toFixed(1) + "px");
						r.setProperty("--py", ((e.clientY / innerHeight - 0.5) * -14).toFixed(1) + "px");
					});
				};
				window.addEventListener("pointermove", mover);
				return () => {window.removeEventListener("keydown", tecla); window.removeEventListener("pointermove", mover);};
			}, []);

			const entrar = async (e) => {
				e.preventDefault();
				const n = nome.trim();
				if (!n) return;
				setInfo("");
				let existente = null;
				try {
					const atuais = lista(await api("listar"));
					setFila(atuais);
					existente = atuais.find((c) => String(c.nome || "").trim().toLowerCase() === n.toLowerCase()) || null;
				} catch {return;}
				if (existente && !statusDe(existente).includes("FINAL")) {
					const onde = statusDe(existente).includes("ATEND") ? "em atendimento" : "na fila";
					setErro(`${existente.nome} já está ${onde}. Use outro nome para diferenciar (ex.: "${existente.nome} 2").`);
					return;
				}
				try {
					await api("entrar", {body: {nome: n}});
					setNome("");
					if (existente) setInfo(`${existente.nome} já tinha cadastro: o cadastro foi reaproveitado e a hora de chegada foi reiniciada.`);
					atualizar();
				} catch { }
			};

			const chamar = async () => {
				try {
					setInfo("");
					const r = await api("chamar");
					setItens([]);
					await sincronizar(nomeDaResposta(r), true);
					atualizar();
					carregarAtendidos();
				} catch { }
			};

			const addItem = async () => {
				const p = produtos.find((x) => String(x.id) === String(prodId));
				try {
					await api("addItem", {vars: {atendimentoId: atual.atendimentoId, produtoId: prodId, quantidade: qtd}});
					setItens((l) => [...l, {produtoId: prodId, nome: p?.nome || `Produto ${prodId}`, quantidade: Number(qtd), valor: valorDe(p)}]);
					carregarProdutos();
				} catch {carregarProdutos();}
			};

			const removerItem = async (i, idx) => {
				try {
					await api("removeItem", {vars: {atendimentoId: atual.atendimentoId, produtoId: i.produtoId, quantidade: i.quantidade}});
					setItens((l) => l.filter((_, k) => k !== idx));
					carregarProdutos();
				} catch { }
			};

			const mudarQtdItem = async (i, idx, delta) => {
				if (delta > 0) {
					try {
						await api("addItem", {vars: {atendimentoId: atual.atendimentoId, produtoId: i.produtoId, quantidade: 1}});
						setItens((l) => l.map((it, k) => (k === idx ? {...it, quantidade: it.quantidade + 1} : it)));
						carregarProdutos();
					} catch {carregarProdutos();}
					return;
				}
				if (i.quantidade <= 1) {await removerItem(i, idx); return;}
				try {
					await api("removeItem", {vars: {atendimentoId: atual.atendimentoId, produtoId: i.produtoId, quantidade: 1}});
					setItens((l) => l.map((it, k) => (k === idx ? {...it, quantidade: it.quantidade - 1} : it)));
					carregarProdutos();
				} catch {carregarProdutos();}
			};

			const finalizar = async () => {
				try {
					await api("finalizar", {vars: {id: atual.clienteId}, body: {[cfg.campoPagamento]: pagamento}});
					setAtual(null); setItens([]);
					atualizar();
					carregarAtendidos();
				} catch { }
			};

			const criarProduto = async (e) => {
				e.preventDefault();
				const body = {nome: form.nome.trim(), valorDeVenda: Number(form.valor)};
				if (form.descricao.trim()) body.descricao = form.descricao.trim();
				if (!form.semEstoque && form.quantidade === "") {setErro("Informe a quantidade em estoque ou marque o ∞ para serviço."); return;}
				body.controlarEstoque = !form.semEstoque;
				if (!form.semEstoque) body.quantidade = Number(form.quantidade);
				if (form.categoriaId === "") {setErro("Escolha a categoria do produto."); return;}
				if (form.valorCompra === "") {setErro("Informe o valor de compra do produto."); return;}
				body.categorias = [{id: Number(form.categoriaId)}];
				body.valorDeCompra = Number(form.valorCompra);
				try {
					await api("novoProduto", {body});
					setAvisoProd(`${body.nome} cadastrado.`);
					setForm(FORM0);
					carregarProdutos();
				} catch {setAvisoProd("");}
			};

			const qtdAjuste = (p) => Math.floor(Number(ajustes[p.id] ?? 1));
			const ajustarEstoque = async (p, sinal) => {
				const n = qtdAjuste(p);
				const novo = (p.quantidade ?? 0) + sinal * n;
				if (!(n >= 1) || novo < 0) return;
				try {
					await api("atualizarProduto", {vars: {id: p.id}, body: {nome: p.nome, valorDeVenda: valorDe(p), valorDeCompra: valorCompraDe(p), quantidade: novo, controlarEstoque: true}});
					carregarProdutos();
				} catch { }
			};

			const excluirProduto = async (p) => {
				if (!window.confirm(`Excluir ${p.nome}?`)) return;
				try {await api("excluirProduto", {vars: {id: p.id}}); carregarProdutos();} catch { }
			};

			const iniciarEdicao = (p) => {
				setEditandoId(p.id);
				setFormEdicao({
					nome: p.nome,
					valorDeVenda: valorDe(p) ?? "",
					valorDeCompra: valorCompraDe(p) ?? "",
					quantidade: semControle(p) ? "" : (p.quantidade ?? ""),
					semEstoque: semControle(p),
				});
			};
			const cancelarEdicao = () => {setEditandoId(null); setFormEdicao(null);};
			const salvarEdicao = async (p) => {
				if (!formEdicao.nome.trim()) {setErro("Informe o nome do produto."); return;}
				if (formEdicao.valorDeVenda === "" || formEdicao.valorDeCompra === "") {setErro("Informe os valores de compra e de venda."); return;}
				if (!formEdicao.semEstoque && formEdicao.quantidade === "") {setErro("Informe a quantidade em estoque ou marque o ∞ para serviço."); return;}
				const body = {
					nome: formEdicao.nome.trim(),
					valorDeVenda: Number(formEdicao.valorDeVenda),
					valorDeCompra: Number(formEdicao.valorDeCompra),
					controlarEstoque: !formEdicao.semEstoque,
					quantidade: formEdicao.semEstoque ? null : Number(formEdicao.quantidade),
				};
				try {
					await api("atualizarProduto", {vars: {id: p.id}, body});
					cancelarEdicao();
					carregarProdutos();
				} catch { }
			};

			// agora o valor de compra vem direto do backend (Produto.valorDeCompra), então o relatório
			// já pode listar todos os produtos, sem depender mais de nada salvo no navegador
			const linhasCompra = produtos.map((p) => {
				const valorCompra = valorCompraDe(p);
				const valorVenda = valorDe(p) ?? 0;
				const qtd = semControle(p) ? 0 : (p.quantidade ?? 0);
				return {
					id: p.id,
					nome: p.nome,
					quantidade: semControle(p) ? "∞" : qtd,
					valorCompra,
					valorVenda,
					pago: semControle(p) ? valorCompra : valorCompra * qtd,
					vendido: semControle(p) ? valorVenda : valorVenda * qtd,
				};
			});
			const totalPago = linhasCompra.reduce((t, l) => t + (l.pago || 0), 0);
			const totalVendido = linhasCompra.reduce((t, l) => t + (l.vendido || 0), 0);

			const baixarRelatorioCompra = () => {
				const cab = ["ID", "Produto", "Quantidade", "Valor de compra", "Valor de venda", "Valor pago", "Valor vendido"];
				const linhasCsv = linhasCompra.map((l) => [l.id, l.nome, l.quantidade, l.valorCompra, l.valorVenda, l.pago.toFixed(2), l.vendido.toFixed(2)]);
				linhasCsv.push([]);
				linhasCsv.push(["", "Total", "", "", "", totalPago.toFixed(2), totalVendido.toFixed(2)]);
				const csv = [cab, ...linhasCsv]
					.map((linha) => linha.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";"))
					.join("\n");
				const blob = new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8;"});
				const url = URL.createObjectURL(blob);
				const a = document.createElement("a");
				a.href = url;
				a.download = `relatorio-de-compra-${new Date().toISOString().slice(0, 10)}.csv`;
				document.body.appendChild(a);
				a.click();
				a.remove();
				URL.revokeObjectURL(url);
			};

			const chaveNomeCategoria = () => {
				const c = categorias[0];
				if (!c) return null;
				if ("nome" in c) return "nome";
				return Object.keys(c).find((k) => k !== "id" && (typeof c[k] === "string" || c[k] === null) && !/img|url/i.test(k)) || null;
			};

			const criarCategoria = async (e) => {
				e.preventDefault();
				const n = nomeCat.trim();
				if (!n) return;
				try {
					const chave = chaveNomeCategoria();
					await api("novaCategoria", {body: chave ? {[chave]: n} : {nome: n, name: n}});
					setAvisoCat(`Categoria ${n} cadastrada.`);
					setNomeCat("");
					carregarCategorias();
				} catch {setAvisoCat("");}
			};

			const valorItem = (i) => Number(i.valor ?? valorDe(produtos.find((x) => String(x.id) === String(i.produtoId)) || {}) ?? 0) || 0;
			const total = itens.reduce((t, i) => t + valorItem(i) * (Number(i.quantidade) || 0), 0);

			const esperando = fila.filter((c) => !statusDe(c).includes("FINAL") && c.id !== atual?.clienteId && statusDe(c) !== "ATENDIMENTO");
			const visiveis = produtos.filter((p) => String(p.nome || "").toLowerCase().includes(filtro.toLowerCase()));
			const podeAdd = atual?.atendimentoId && prodId && Number(qtd) >= 1;

			const linhas = atendidos
				.filter((o) => ehHoje(o.inicioAtendimento))
				.sort((a, b) => b.id - a.id)
				.map((o) => {
					const its = itensDoAtendimento(o);
					const finalizado = !!o.pagamento || statusDe(o.cliente).includes("FINAL");
					return {
						id: o.id,
						nome: o.cliente?.nome ?? "—",
						inicio: o.inicioAtendimento,
						fim: fimDe(o),
						situacao: finalizado ? "Finalizado" : "Em atendimento",
						pagamento: o.pagamento?.statusRecebimento ?? o.pagamento?.formaPagamento ?? o.cliente?.statusRecebimento ?? "—",
						total: its.length ? its.reduce((t, i) => t + valorItem(i) * i.quantidade, 0) : null,
					};
				});
			const somaDia = linhas.reduce((t, l) => t + (l.total ?? 0), 0);

			// relatório final do dia: usa a mesma base de /orders da lista de clientes atendidos
			const rotuloForma = (f) => ({PIX: "Pix", CARTAO: "Cartão", DINHEIRO: "Dinheiro"}[f] || f);
			const doPeriodo = atendidos.filter((o) => noPeriodo(o.inicioAtendimento, periodo, dataEscolhida));
			const finalizados = doPeriodo.filter((o) => !!o.pagamento || statusDe(o.cliente).includes("FINAL"));
			const totalDe = (o) => itensDoAtendimento(o).reduce((t, i) => t + valorItem(i) * (Number(i.quantidade) || 0), 0);
			const formaDe = (o) => String(o.pagamento?.statusRecebimento ?? o.pagamento?.formaPagamento ?? o.cliente?.statusRecebimento ?? "NÃO INFORMADO").toUpperCase();
			const porForma = {};
			const vendidos = {};
			finalizados.forEach((o) => {
				const f = formaDe(o);
				porForma[f] = porForma[f] || {qtd: 0, valor: 0};
				porForma[f].qtd += 1;
				porForma[f].valor += totalDe(o);
				itensDoAtendimento(o).forEach((i) => {
					const nomeI = i.nome || produtos.find((x) => String(x.id) === String(i.produtoId))?.nome || `Produto ${i.produtoId}`;
					const q = Number(i.quantidade) || 0;
					vendidos[nomeI] = vendidos[nomeI] || {qtd: 0, valor: 0};
					vendidos[nomeI].qtd += q;
					vendidos[nomeI].valor += valorItem(i) * q;
				});
			});
			const faturamento = finalizados.reduce((t, o) => t + totalDe(o), 0);
			const ticket = finalizados.length ? faturamento / finalizados.length : 0;
			const emAndamento = doPeriodo.length - finalizados.length;

			// contador "Atendidos" do topo: sempre só hoje, não segue o período escolhido no Relatório de vendas
			const finalizadosHoje = atendidos.filter((o) => ehHoje(o.inicioAtendimento) && (!!o.pagamento || statusDe(o.cliente).includes("FINAL")));

			// "Faturamento" do topo tem filtro próprio (engrenagem), independente do período do relatório
			const doPeriodoTopo = atendidos.filter((o) => noPeriodo(o.inicioAtendimento, periodoTopo, dataEscolhidaTopo));
			const finalizadosTopo = doPeriodoTopo.filter((o) => !!o.pagamento || statusDe(o.cliente).includes("FINAL"));
			const faturamentoTopo = finalizadosTopo.reduce((t, o) => t + totalDe(o), 0);
			const listaForma = Object.entries(porForma).sort((a, b) => b[1].valor - a[1].valor);
			const listaVendidos = Object.entries(vendidos).sort((a, b) => b[1].valor - a[1].valor);
			const estoqueBaixo = produtos.filter((p) => !semControle(p) && p.quantidade <= 3);

			return (
				<>
					<header>
						<h1>Painel do salão</h1>
						<div className="row">
							<button className="ghost" onClick={atualizarTudo}>Atualizar tudo</button>
						</div>

												</span>
											</li>
										))}
									</ul>
								)}
							</section>

							<section>
								<details>
									<summary>Clientes atendidos hoje ({linhas.length})</summary>
								<div className="row" style={{justifyContent: "flex-end", marginBottom: 12}}>
									<button className="ghost" onClick={carregarAtendidos}>Recarregar</button>
								</div>
								{linhas.length === 0 ? <p className="vazio">Nenhum atendimento hoje.</p> : (
									<div className="scroll">
										<table>
											<thead>
												<tr><th>#</th><th>Cliente</th><th>Início</th><th>Fim</th><th>Situação</th><th>Pagamento</th><th className="num">Total</th></tr>
											</thead>
											<tbody>
												{linhas.map((l) => (
													<tr key={l.id}>
														<td>{l.id}</td>
														<td>{l.nome}</td>
														<td>{hora(l.inicio)}</td>
														<td>{l.fim ? hora(l.fim) : "—"}</td>
														<td>{l.situacao}</td>
														<td>{l.pagamento}</td>
														<td className="num">{l.total != null ? reais(l.total) : "—"}</td>
													</tr>
												))}
											</tbody>
										</table>
									</div>
								)}
								{somaDia > 0 && <p><strong>Total do dia: {reais(somaDia)}</strong></p>}
								<p className="muted">Cada linha é um atendimento. O total só aparece quando /orders devolve os itens, e o fim quando o back-end guarda a hora de finalização.</p>
								</details>
							</section>

							<section>
								<details className="cfg">
									<summary>Endpoints da API</summary>
									<p className="muted">Formato: MÉTODO /caminho.</p>
									{Object.keys(PADRAO).map((k) => (
										<label key={k}>{ROTULOS[k]}
											<input value={cfg[k]} onChange={(e) => salvarCfg({...cfg, [k]: e.target.value})} />
										</label>
									))}
									<button className="ghost" onClick={() => salvarCfg(PADRAO)}>Restaurar padrão</button>
								</details>
							</section>

							<section>
								<h2>Log das requisições</h2>
								<div className="log">
									{log.length === 0 && <span className="vazio">Nenhuma chamada ainda.</span>}
									{log.map((l, i) => (
										<div key={i} className={l.ok ? "ok" : "err"}>{l.hora}  {l.req}{"\n"}→ {l.res}</div>
									))}
								</div>
							</section>
						</div>
					</main>

				</>
			);
		}
		ReactDOM.createRoot(document.getElementById("root")).render(<App />);
	</script>
</body>

</html>
